            return formulas[reactionType] || formulas.hydrogenation;
        }

        function startAnimation(animationType, questionIndex) {
            // Adicionar animações CSS para movimento das moléculas
            const style = document.createElement('style');
            style.textContent = `
                #animation-${questionIndex} svg {
                    animation: fadeIn 1s ease-in;
                }
                
                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
                
                #animation-${questionIndex} circle {
                    animation: pulse 2s infinite;
                }
                
                @keyframes pulse {
                    0%, 100% { transform: scale(1); }
                    50% { transform: scale(1.1); }
                }
            `;
            document.head.appendChild(style);
        }

        function startQuestionTimer() {
            const timer = setInterval(() => {
                if (questionStartTime) {
                    const elapsed = Math.floor((new Date() - questionStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('questionTimer').textContent = 
                        `Tempo: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                } else {
                    clearInterval(timer);
                }
            }, 1000);
        }

        window.selectOption = function(optionIndex) {
            const optionsContainer = document.getElementById(`options-${currentQuestion}`);
            const options = optionsContainer.querySelectorAll('.option');
            const confirmBtn = document.getElementById(`confirmBtn-${currentQuestion}`);

            // Limpar seleções anteriores
            options.forEach(opt => {
                opt.classList.remove('selected');
            });

            // Marcar opção selecionada
            options[optionIndex].classList.add('selected');
            selectedOption = optionIndex;

            // Mostrar botão confirmar
            confirmBtn.style.display = 'inline-block';
        };

        window.confirmAnswer = function() {
            if (selectedOption === null) return;

            const question = questions[currentQuestion];
            const optionsContainer = document.getElementById(`options-${currentQuestion}`);
            const options = optionsContainer.querySelectorAll('.option');
            const confirmBtn = document.getElementById(`confirmBtn-${currentQuestion}`);

            // Incrementar tentativas
            attempts[currentQuestion]++;

            // Esconder botão confirmar
            confirmBtn.style.display = 'none';

            // Salvar resposta e tempo
            answers[currentQuestion] = selectedOption;
            questionTimes[currentQuestion] = Math.floor((new Date() - questionStartTime) / 1000);
            questionStartTime = null;

            // Marcar visualmente as opções
            options.forEach((option, index) => {
                option.style.pointerEvents = 'none'; // Desabilitar cliques
                if (index === question.correct) {
                    option.classList.add('correct');
                } else if (index === selectedOption && index !== question.correct) {
                    option.classList.add('incorrect');
                }
            });

            if (selectedOption === question.correct) {
                // Resposta correta
                showModal(true, "🎉 Parabéns! Resposta correta!");
            } else {
                // Resposta incorreta
                showModal(false, "❌ Resposta incorreta. Tente novamente na próxima!");
            }

            selectedOption = null;
        };

        function showModal(isCorrect, message, isLastAttempt = false) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            
            const icon = isCorrect ? '🎉' : '❌';
            const title = isCorrect ? 'Parabéns!' : 'Ops!';
            const titleClass = isCorrect ? 'correct' : 'incorrect';
            const contentClass = isCorrect ? 'correct' : 'incorrect';

            modal.innerHTML = `
                <div class="modal-content ${contentClass}">
                    <div class="modal-icon">${icon}</div>
                    <div class="modal-title ${titleClass}">${title}</div>
                    <p style="color: #4a5568; line-height: 1.6; margin-bottom: 25px;">${message}</p>
                    <button class="btn" onclick="proceedToNext()">
                        ${currentQuestion < questions.length - 1 ? 'Próxima Questão' : 'Ver Resultados'}
                    </button>
                </div>
            `;

            document.body.appendChild(modal);
        }

        window.proceedToNext = function() {
            // Fechar modal
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.remove();
            }

            // Ir diretamente para próxima questão ou finalizar
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        };

        window.nextQuestion = function() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        };

        window.finishQuiz = function() {
            // Calcular tempo total
            const totalTime = Math.floor((new Date() - startTime) / 1000);
            
            // Salvar dados do aluno
            saveStudentData();
            
            // Mostrar resultados
            showResults(totalTime);
        };

        function showResults(totalTime) {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');

            // Calcular estatísticas
            const correctAnswers = answers.filter((answer, index) => answer === questions[index].correct).length;
            const totalQuestions = questions.length;
            const percentage = Math.round((correctAnswers * 100) / totalQuestions);
            const totalAttempts = questions.length; // Uma tentativa por questão
            const avgTime = Math.round(questionTimes.reduce((sum, time) => sum + time, 0) / totalQuestions);

            // Estatísticas por tipo de reação
            const typeStats = {};
            questions.forEach((q, index) => {
                if (!typeStats[q.type]) {
                    typeStats[q.type] = { correct: 0, total: 0 };
                }
                typeStats[q.type].total++;
                if (answers[index] === q.correct) {
                    typeStats[q.type].correct++;
                }
            });

            // Mostrar resumo
            const summaryHTML = `
                <div class="result-card">
                    <h3>Pontuação Final</h3>
                    <div class="value">${correctAnswers}/${totalQuestions}</div>
                    <p>${percentage}%</p>
                </div>
                <div class="result-card">
                    <h3>Tempo Total</h3>
                    <div class="value">${Math.floor(totalTime / 60)}:${(totalTime % 60).toString().padStart(2, '0')}</div>
                    <p>minutos</p>
                </div>
                <div class="result-card">
                    <h3>Tempo Médio</h3>
                    <div class="value">${Math.floor(avgTime / 60)}:${(avgTime % 60).toString().padStart(2, '0')}</div>
                    <p>por questão</p>
                </div>
            `;

            document.getElementById('resultsSummary').innerHTML = summaryHTML;

            // Mostrar resultados detalhados
            let detailedHTML = '<h3 style="margin: 30px 0 20px 0; color: #4a5568;">Desempenho por Questão</h3>';
            
            questions.forEach((question, index) => {
                const isCorrect = answers[index] === question.correct;
                const timeStr = `${Math.floor(questionTimes[index] / 60)}:${(questionTimes[index] % 60).toString().padStart(2, '0')}`;
                
                detailedHTML += `
                    <div class="question-container" style="margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <span style="font-weight: 600;">Questão ${index + 1}: ${question.subtype}</span>
                            <span style="color: ${isCorrect ? '#38a169' : '#e53e3e'}; font-weight: 600;">
                                ${isCorrect ? '✓ Correta' : '✗ Incorreta'}
                            </span>
                        </div>
