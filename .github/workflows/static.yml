        window.showRanking = function() {
            const studentsData = JSON.parse(localStorage.getItem('studentsData') || '[]');
            
            if (studentsData.length === 0) {
                alert('Ainda não há dados suficientes para mostrar o ranking!');
                return;
            }

            // Ordenar por percentual (decrescente) e depois por tempo (crescente)
            const sortedStudents = studentsData.sort((a, b) => {
                if (b.percentage !== a.percentage) {
                    return b.percentage - a.percentage;
                }
                // Se percentuais iguais, ordenar por tempo (menor tempo primeiro)
                const timeA = parseInt(a.totalTime.split(':')[0]) * 60 + parseInt(a.totalTime.split(':')[1]);
                const timeB = parseInt(b.totalTime.split(':')[0]) * 60 + parseInt(b.totalTime.split(':')[1]);
                return timeA - timeB;
            });

            let rankingHTML = '<h3 style="margin: 30px 0 20px 0; color: #4a5568;">🏆 Ranking Geral dos Alunos</h3>';
            
            sortedStudents.forEach((student, index) => {
                const position = index + 1;
                let medal = '';
                let bgColor = '#f8fafc';
                
                if (position === 1) {
                    medal = '🥇';
                    bgColor = '#fef5e7';
                } else if (position === 2) {
                    medal = '🥈';
                    bgColor = '#f7fafc';
                } else if (position === 3) {
                    medal = '🥉';
                    bgColor = '#fef5e7';
                }
                
                rankingHTML += `
                    <div style="background: ${bgColor}; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid ${student.percentage >= 70 ? '#38a169' : '#e53e3e'};">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span style="font-size: 24px; font-weight: bold; color: #4a5568;">${medal} ${position}º</span>
                                <div>
                                    <div style="font-weight: 600; color: #2d3748;">${student.name}</div>
                                    <div style="font-size: 14px; color: #718096;">${student.grade} - Turma ${student.class}</div>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 20px; font-weight: bold; color: ${student.percentage >= 70 ? '#38a169' : '#e53e3e'};">
                                    ${student.percentage}%
                                </div>
                                <div style="font-size: 14px; color: #718096;">
                                    ${student.score} • ${student.totalTime}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            // Adicionar estatísticas do ranking
            const totalStudents = studentsData.length;
            const averageScore = Math.round(studentsData.reduce((sum, s) => sum + s.percentage, 0) / totalStudents);
            const topPerformers = studentsData.filter(s => s.percentage >= 80).length;
            
            rankingHTML += `
                <div style="margin-top: 30px; padding: 20px; background: #e6fffa; border-radius: 10px;">
                    <h4 style="color: #2d3748; margin-bottom: 15px;">📊 Estatísticas do Ranking</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #667eea;">${totalStudents}</div>
                            <div style="font-size: 14px; color: #4a5568;">Total de Alunos</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #667eea;">${averageScore}%</div>
                            <div style="font-size: 14px; color: #4a5568;">Média Geral</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #38a169;">${topPerformers}</div>
                            <div style="font-size: 14px; color: #4a5568;">Acima de 80%</div>
                        </div>
                    </div>
