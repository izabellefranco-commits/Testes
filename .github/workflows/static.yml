        window.loginProfessor = function() {
            const usuario = document.getElementById('usuarioProf').value.trim();
            const senha = document.getElementById('senhaProf').value.trim();
            const feedback = document.getElementById('loginProfFeedback');
            
            // Validar campos
            if (!usuario || !senha) {
                feedback.innerHTML = '<p style="color: #e53e3e; font-weight: 600;">❌ Por favor, preencha todos os campos!</p>';
                return;
            }
            
            // Validar credenciais
            const isSeducEmail = usuario.endsWith('@edu.mt.gov.br');
            const isValidPassword = senha === 'prof123';
            
            if (isSeducEmail && isValidPassword) {
                feedback.innerHTML = '<p style="color: #38a169; font-weight: 600;">✅ Login realizado com sucesso!</p>';
                
                setTimeout(() => {
                    document.getElementById('loginProfessor').classList.add('hidden');
                    document.getElementById('teacherPanel').classList.remove('hidden');
                    loadTeacherData();
                }, 1000);
                
            } else {
                if (!isSeducEmail) {
                    feedback.innerHTML = '<p style="color: #e53e3e; font-weight: 600;">❌ Use seu email institucional @edu.mt.gov.br</p>';
                } else {
                    feedback.innerHTML = '<p style="color: #e53e3e; font-weight: 600;">❌ Email ou senha incorretos!</p>';
                }
            }
        };

        // Função para salvar dados do estudante
        function saveStudentData() {
            const correctAnswers = answers.filter((answer, index) => answer === questions[index].correct).length;
            const totalQuestions = questions.length;
            const percentage = Math.round((correctAnswers * 100) / totalQuestions);
            const totalTime = Math.floor((new Date() - startTime) / 1000);
            const totalTimeFormatted = `${Math.floor(totalTime / 60)}:${(totalTime % 60).toString().padStart(2, '0')}`;

            const studentResult = {
                name: studentData.name,
                email: studentData.email,
                grade: studentData.grade,
                class: studentData.class,
                score: `${correctAnswers}/${totalQuestions}`,
                percentage: percentage,
                totalTime: totalTimeFormatted,
                date: new Date().toLocaleDateString('pt-BR'),
                timestamp: new Date().toISOString()
            };

            // Recuperar dados existentes
            const existingData = JSON.parse(localStorage.getItem('studentsData') || '[]');
            
            // Adicionar novo resultado
            existingData.push(studentResult);
            
            // Salvar no localStorage
            localStorage.setItem('studentsData', JSON.stringify(existingData));
            
            console.log('💾 Dados do aluno salvos:', studentResult);
        }

