        function loadTeacherData() {
            const studentsData = JSON.parse(localStorage.getItem('studentsData') || '[]');
            
            // Atualizar estatísticas gerais
            document.getElementById('totalStudents').textContent = studentsData.length;
            document.getElementById('completedQuizzes').textContent = studentsData.length;
            
            if (studentsData.length > 0) {
                const averageScore = studentsData.reduce((sum, student) => sum + student.percentage, 0) / studentsData.length;
                const highestScore = Math.max(...studentsData.map(s => s.percentage));
                
                document.getElementById('generalAverage').textContent = Math.round(averageScore) + '%';
                document.getElementById('highestScore').textContent = highestScore + '%';
            } else {
                document.getElementById('generalAverage').textContent = '0%';
                document.getElementById('highestScore').textContent = '0%';
            }

            // Criar ranking detalhado por série
            createDetailedRanking(studentsData);
        }

        function createDetailedRanking(studentsData) {
            const detailedRankingDiv = document.getElementById('detailedRanking');
            
            if (studentsData.length === 0) {
                detailedRankingDiv.innerHTML = `
                    <div class="ranking-section">
                        <h3 style="color: #4a5568; margin-bottom: 15px;">📊 Ranking Detalhado por Série</h3>
                        <p style="color: #718096; text-align: center; padding: 40px;">
                            Nenhum aluno realizou o quiz ainda.
                        </p>
                    </div>
                `;
                return;
            }

            // Agrupar por série
            const gradeGroups = {};
            studentsData.forEach(student => {
                if (!gradeGroups[student.grade]) {
                    gradeGroups[student.grade] = [];
                }
                gradeGroups[student.grade].push(student);
            });

            let rankingHTML = `
                <div class="ranking-section">
                    <h3 style="color: #4a5568; margin-bottom: 20px;">📊 Ranking Detalhado por Série</h3>
            `;

            // Para cada série
            Object.keys(gradeGroups).sort().forEach(grade => {
                const students = gradeGroups[grade];
                
                // Ordenar estudantes por performance
                students.sort((a, b) => {
                    if (b.percentage !== a.percentage) {
                        return b.percentage - a.percentage;
                    }
                    const timeA = parseInt(a.totalTime.split(':')[0]) * 60 + parseInt(a.totalTime.split(':')[1]);
                    const timeB = parseInt(b.totalTime.split(':')[0]) * 60 + parseInt(b.totalTime.split(':')[1]);
                    return timeA - timeB;
                });

                const averageGrade = Math.round(students.reduce((sum, s) => sum + s.percentage, 0) / students.length);
                
                rankingHTML += `
                    <div style="margin-bottom: 30px;">
                        <h4 style="color: #667eea; margin-bottom: 15px; padding: 10px; background: #f7fafc; border-radius: 8px;">
                            🎓 ${grade} - ${students.length} aluno(s) - Média: ${averageGrade}%
                        </h4>
                `;

                students.forEach((student, index) => {
                    const position = index + 1;
                    let performanceClass = 'student-item';
                    
                    if (student.percentage >= 90) performanceClass += ' excellent';
                    else if (student.percentage >= 80) performanceClass += ' good';
                    else if (student.percentage >= 70) performanceClass += ' average';
                    else performanceClass += ' poor';

                    let medal = '';
                    if (position === 1) medal = '🥇';
                    else if (position === 2) medal = '🥈';
                    else if (position === 3) medal = '🥉';

                    rankingHTML += `
                        <div class="${performanceClass}">
                            <div>
                                <div style="font-weight: 600; color: #2d3748;">
                                    ${medal} ${position}º - ${student.name}
                                </div>
                                <div style="font-size: 14px; color: #718096;">
                                    Turma ${student.class} • ${student.date} • ${student.totalTime}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 18px; font-weight: bold; color: ${student.percentage >= 70 ? '#38a169' : '#e53e3e'};">
                                    ${student.percentage}%
                                </div>
                                <div style="font-size: 14px; color: #718096;">
                                    ${student.score}
                                </div>
                            </div>
                        </div>
                    `;
                });

                rankingHTML += '</div>';
            });

            rankingHTML += '</div>';
            detailedRankingDiv.innerHTML = rankingHTML;
        }

