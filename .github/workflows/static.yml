        // ===== FUNÇÕES PRINCIPAIS DO QUIZ =====
        
        window.startQuiz = function() {
            // Validar dados do formulário
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();
            const grade = document.getElementById('studentGrade').value;
            const studentClass = document.getElementById('studentClass').value.trim();

            if (!name || !email || !grade || !studentClass) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }

            // Validar email institucional (básico)
            if (!email.includes('@') || !email.includes('.')) {
                alert('Por favor, insira um e-mail válido.');
                return;
            }

            // Salvar dados do estudante
            studentData = {
                name: name,
                email: email,
                grade: grade,
                class: studentClass
            };

            // Embaralhar questões
            shuffleQuestions();

            // Inicializar arrays de controle
            answers = new Array(questions.length).fill(null);
            questionTimes = new Array(questions.length).fill(0);
            attempts = new Array(questions.length).fill(0);

            // Iniciar cronômetro geral
            startTime = new Date();

            // Mostrar quiz
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');

            // Carregar primeira questão
            loadQuestion();
        };

        function shuffleQuestions() {
            // Algoritmo Fisher-Yates para embaralhar array
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
        }

        function loadQuestion() {
            const question = questions[currentQuestion];
            questionStartTime = new Date();

            // Atualizar barra de progresso
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Criar HTML da questão
            const questionHTML = `
                <div class="question-container">
                    <div class="question-header">
                        <div class="question-number">Questão ${currentQuestion + 1} de ${questions.length}</div>
                        <div class="question-timer" id="questionTimer">Tempo: 00:00</div>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <span style="background: #e2e8f0; padding: 5px 10px; border-radius: 15px; font-size: 12px; color: #4a5568;">
                            ${question.difficulty}
                        </span>
                    </div>

                    <div class="molecule-animation" id="animation-${currentQuestion}">
                        ${createStructuralFormula(question.animation, question.relatedImage)}
                    </div>

                    <h3 style="margin: 20px 0; color: #2d3748; line-height: 1.6;">${question.question}</h3>
                    
                    <p style="font-size: 14px; color: #718096; margin-bottom: 20px;">
                        <strong>Fonte:</strong> ${question.source}
                    </p>

                    <div class="options" id="options-${currentQuestion}">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})" data-index="${index}">
                                ${option}
                            </div>
                        `).join('')}
                    </div>

                    <div style="text-align: center; margin: 25px 0;">
                        <button class="btn" id="confirmBtn-${currentQuestion}" onclick="confirmAnswer()" style="display: none; background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);">
                            ✓ Confirmar Resposta
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('questionContainer').innerHTML = questionHTML;

            // Iniciar animação
            startAnimation(question.animation, currentQuestion);

            // Iniciar cronômetro da questão
            startQuestionTimer();

            // Esconder botões
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishBtn').style.display = 'none';
        }

