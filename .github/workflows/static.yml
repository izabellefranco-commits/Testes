        }, 0);
        const avgTimeInSeconds = Math.round(totalTimeInSeconds / totalStudents);
        const avgTimeFormatted = `${Math.floor(avgTimeInSeconds / 60)}:${(avgTimeInSeconds % 60).toString().padStart(2, '0')}`;

